name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two stages, deliberately different in what they cost.
#
#   check  — lint, typecheck, unit tests, build, bundle. No services,
#            under a minute, and it uploads the bundle so every green
#            commit has a downloadable artifact.
#   e2e    — the real htcondor-api in demo mode, driven through a
#            browser. Minutes, and only worth starting if `check`
#            passed: an app that does not compile cannot fail an
#            end-to-end test in an informative way.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make check
      - run: make bundle
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make install
      - run: npx --prefix web playwright install --with-deps chromium
      - run: make e2e
        env:
          # Pin this to a release tag in your own repository. `latest`
          # here means the template tracks the current server; in a lab
          # repo it means your CI breaks on somebody else's release.
          API_IMAGE: ghcr.io/bbockelm/golang-htcondor:latest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
